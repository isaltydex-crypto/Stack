# v2.8 VPS reverse proxy. Replace api.example.com/dashboard.example.com.
# You can also set both server_name values to the VPS IP for first smoke test over HTTP.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name api.example.com dashboard.example.com _;

  client_max_body_size 2m;

  location /health { proxy_pass http://omerta-core-server:8080/health; }
  location /ready { proxy_pass http://omerta-core-server:8080/ready; }
  location /metrics { proxy_pass http://omerta-core-server:8080/metrics; }

  location /ws/ {
    proxy_pass http://omerta-core-server:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/ {
    proxy_pass http://omerta-core-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    proxy_pass http://omerta-core-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Creator panel. Keep this behind VPN/IP allowlist in production.
  location / {
    proxy_pass http://omerta-creator-dashboard:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

