# Omerta VPS HTTPS config. Replace domains and mount certs into ./certs.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name api.example.com dashboard.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.example.com;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  client_max_body_size 4m;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /health { proxy_pass http://omerta-core-server:8080/health; }
  location = /ready { proxy_pass http://omerta-core-server:8080/ready; }
  location = /metrics { proxy_pass http://omerta-core-server:8080/metrics; }

  location /ws/ {
    proxy_pass http://omerta-core-server:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://omerta-core-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl http2;
  server_name dashboard.example.com;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # Recommended: add allow/deny rules here or expose only through WireGuard.
  # allow 10.8.0.0/24;
  # allow YOUR_ADMIN_IP;
  # deny all;

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    proxy_pass http://omerta-creator-dashboard:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}


