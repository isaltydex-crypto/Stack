# Omerta VPS HTTP-first config.
# Use this for first deploy by IP. Later switch to HTTPS config when domain/certs are ready.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 4m;

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /health { proxy_pass http://omerta-core-server:8080/health; }
  location = /ready { proxy_pass http://omerta-core-server:8080/ready; }
  location = /metrics { proxy_pass http://omerta-core-server:8080/metrics; }

  location /ws/ {
    proxy_pass http://omerta-core-server:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/ {
    proxy_pass http://omerta-core-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    proxy_pass http://omerta-core-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /creator/ {
    proxy_pass http://omerta-core-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /billing/ {
    proxy_pass http://omerta-core-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ops/ {
    proxy_pass http://omerta-core-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Creator panel. For production, expose this only through WireGuard/VPN or uncomment an allowlist.
  # allow 10.8.0.0/24;
  # deny all;
  location / {
    proxy_pass http://omerta-creator-dashboard:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}


