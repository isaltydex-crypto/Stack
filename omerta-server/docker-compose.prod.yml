services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omerta
      POSTGRES_USER: omerta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - omerta-postgres:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omerta -d omerta"]
      interval: 10s
      timeout: 5s
      retries: 5

  omerta-core-server:
    build: ./omerta-core-server
    restart: unless-stopped
    env_file:
      - ./omerta-core-server/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5

  omerta-creator-dashboard:
    build:
      context: ./omerta-creator-dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL}
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - omerta-core-server
      - omerta-creator-dashboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/omerta-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  omerta-postgres:
