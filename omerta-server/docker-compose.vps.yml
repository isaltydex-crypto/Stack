services:
  omerta-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omerta}
      POSTGRES_USER: ${POSTGRES_USER:-omerta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - omerta-postgres:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omerta} -d ${POSTGRES_DB:-omerta}"]
      interval: 10s
      timeout: 5s
      retries: 10

  omerta-core-server:
    build: ./omerta-core-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in .env}
      OMERTA_PROVISIONING_SECRET: ${OMERTA_PROVISIONING_SECRET:-}
      CREATOR_EMAIL: ${CREATOR_EMAIL:?set CREATOR_EMAIL in .env}
      CREATOR_PASSWORD: ${CREATOR_PASSWORD:?set CREATOR_PASSWORD in .env}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:?set DASHBOARD_ORIGIN in .env}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in .env}
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:?set PUBLIC_WS_URL in .env}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      NOWPAYMENTS_PRICE_CURRENCY: ${NOWPAYMENTS_PRICE_CURRENCY:-usd}
      NOWPAYMENTS_PAYOUT_CURRENCY: ${NOWPAYMENTS_PAYOUT_CURRENCY:-usdttrc20}
      NOWPAYMENTS_MONTHLY_USD: ${NOWPAYMENTS_MONTHLY_USD:-29}
      NOWPAYMENTS_SIX_MONTHS_USD: ${NOWPAYMENTS_SIX_MONTHS_USD:-149}
      NOWPAYMENTS_YEARLY_USD: ${NOWPAYMENTS_YEARLY_USD:-249}
      NOWPAYMENTS_API_BASE_URL: ${NOWPAYMENTS_API_BASE_URL:-https://api.nowpayments.io/v1}
      BILLING_RETURN_URL: ${BILLING_RETURN_URL:-omerta://billing/return}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-omerta://billing/cancel}
      RELAY_PAYLOAD_DEFAULT_TTL_MINUTES: ${RELAY_PAYLOAD_DEFAULT_TTL_MINUTES:-1440}
      RELAY_PAYLOAD_MAX_TTL_MINUTES: ${RELAY_PAYLOAD_MAX_TTL_MINUTES:-4320}
    depends_on:
      omerta-postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 10

  omerta-creator-dashboard:
    build:
      context: ./omerta-creator-dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL in .env}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      omerta-core-server:
        condition: service_healthy
      omerta-creator-dashboard:
        condition: service_started
    ports:
      - "80:80"
      # Enable 443 after you add certs and switch nginx config to HTTPS.
      # - "443:443"
    volumes:
      - ./docker/nginx/omerta-vps-http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./releases:/usr/share/nginx/html/releases:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  omerta-postgres:

